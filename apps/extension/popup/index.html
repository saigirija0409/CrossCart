<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossCart Unifier</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Kollektif:wght@400;500;700&display=swap");

      body {
        margin: 0;
        width: 340px;
        font-family: "Kollektif", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0E1B2E;
        color: #E1CBD7;
      }
      .wrap {
        padding: 18px;
        display: grid;
        gap: 14px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .brand {
        font-weight: 700;
        font-size: 1.1rem;
        color: #E1CBD7;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .user-badge {
        font-size: 0.78rem;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(134, 168, 207, 0.15);
        border: 1px solid rgba(134, 168, 207, 0.3);
        color: #E1CBD7;
      }
      .card {
        padding: 14px;
        border-radius: 16px;
        border: 1px solid rgba(134, 168, 207, 0.25);
        background: #26425A;
        display: grid;
        gap: 8px;
      }
      .site-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: #E1CBD7;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .muted {
        color: #86A8CF;
        font-size: 0.82rem;
        line-height: 1.4;
      }
      .sync-btn {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: #C38EB4;
        color: #0E1B2E;
        font-size: 0.95rem;
        font-weight: 700;
        padding: 12px;
        cursor: pointer;
        transition: transform 120ms ease, opacity 120ms ease;
        box-shadow: 0 4px 15px rgba(11, 23, 48, 0.4);
      }
      .sync-btn:hover {
        transform: translateY(-1px);
        background: #E1CBD7;
      }
      .sync-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
      .status {
        font-size: 0.83rem;
        color: #86A8CF;
        padding: 6px 2px;
        line-height: 1.4;
      }
      .status.success {
        color: #E1CBD7;
      }
      .status.error {
        color: #C38EB4;
      }
    </style>
    <script type="module" src="./popup.js"></script>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="brand">CrossCart</div>
        <div class="user-badge" id="userBadge">Connecting...</div>
      </div>

      <div class="card">
        <div class="site-pill" id="site">Detecting active page...</div>
        <p class="muted" id="siteHelp">Open your wishlist page on Amazon, Flipkart, Myntra, Ajio, Tata CLiQ, or Nykaa, then click Sync Current Tab below.</p>
      </div>

      <button id="sync" class="sync-btn">Sync Current Tab</button>

      <div class="status" id="status">Checking authentication status...</div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CrossCart — one wishlist for every store</title>
    <meta name="description" content="CrossCart unifies your wishlists from Amazon, Flipkart, Myntra, Ajio, Tata CLiQ and Nykaa, then recommends what you're likely to want next." />
    <meta name="theme-color" content="#070c1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef1fa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237fb0e8'/%3E%3Cstop offset='1' stop-color='%23c38eb4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 7l9 5-9 5-9-5 9-5z' fill='none' stroke='%230a0f1f' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 17l9 5 9-5' fill='none' stroke='%230a0f1f' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint so there is no light/dark flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem("crosscart_theme") || "dark";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
